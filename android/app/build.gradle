plugins { id 'com.android.application' }
android {
  namespace 'com.antenalibre.app'
  compileSdk 34
  defaultConfig {
    applicationId 'com.antenalibre.app'
    minSdk 24
    targetSdk 34
    versionCode 2
    versionName '0.2.0'
  }
  signingConfigs {
    debug {
      storeFile file('debug.p12')
      storePassword 'antena123'
      keyAlias 'antena'
      keyPassword 'antena123'
      storeType 'pkcs12'
    }
  }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}
dependencies {
  implementation 'androidx.appcompat:appcompat:1.6.1'
  implementation 'androidx.webkit:webkit:1.10.0'
}
