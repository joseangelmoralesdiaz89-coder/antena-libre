plugins {
    id 'com.android.application'
}

android {
    namespace 'com.antenalibre.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.antenalibre.app"
        minSdk 24
        targetSdk 34
        versionCode 3
        versionName "0.3.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.webkit:webkit:1.10.0'
}
