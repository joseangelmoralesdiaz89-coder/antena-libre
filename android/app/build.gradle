plugins {
    id 'com.android.application'
}

android {
    namespace 'com.antenalibre.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.antenalibre.app"
        minSdk 23
        targetSdk 34
        versionCode 3
        versionName "0.3.0-global"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}