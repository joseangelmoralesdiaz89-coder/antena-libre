name: Build Android APK

on:
  push:
    branches:
      - main
      - principal
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate icon PNGs
        run: |
          python3 -c '
          import struct, zlib, os
          def png(w, h, rgba):
              def chunk(tag, data):
                  return struct.pack("!I", len(data)) + tag + data + struct.pack("!I", zlib.crc32(tag + data) & 0xffffffff)
              raw = b"".join(b"\x00" + bytes(rgba(x, y)) for y in range(h) for x in range(w))
              return b"\x89PNG\r\n\x1a\n" + chunk(b"IHDR", struct.pack("!IIBBBBB", w, h, 8, 6, 0, 0, 0)) + chunk(b"IDAT", zlib.compress(raw)) + chunk(b"IEND", b"")
          sizes = {"mdpi":48,"hdpi":72,"xhdpi":96,"xxhdpi":144,"xxxhdpi":192}
          for d, s in sizes.items():
              folder = f"android/app/src/main/res/mipmap-{d}"
              os.makedirs(folder, exist_ok=True)
              data = png(s, s, lambda x,y,s=s: (17,17,17,255) if (x-s/2)**2+(y-s/2)**2 <= (s*0.42)**2 else (0,200,120,255) if abs(x-s/2)<s*0.05 and y>s*0.45 else (0,0,0,0))
              open(f"{folder}/ic_launcher.png", "wb").write(data)
          '

      - name: Copy web and app assets
        run: |
          mkdir -p android/app/src/main/assets
          if [ -d src/web ]; then cp -r src/web android/app/src/main/assets/web; fi
          if [ -d src/app ]; then cp -r src/app android/app/src/main/assets/app; fi

      - name: Build Debug APK
        run: |
          cd android
          gradle assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: antena-libre-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
