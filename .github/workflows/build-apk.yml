name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Copiar assets web
        run: |
          test -f src/web/index.html
          A=android/app/src/main/assets
          rm -rf $A && mkdir -p $A/web $A/app
          cp -r src/web/. $A/web/
          cp -r src/app/. $A/app/ 2>/dev/null || true
      - name: Compilar APK debug
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Preparar APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk AntenaLibre.apk
      - uses: actions/upload-artifact@v4
        with:
          name: antena-libre-apk
          path: AntenaLibre.apk
      - name: Publicar release latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag -y || true
          gh release create latest AntenaLibre.apk --title "Antena Libre (ultimo build)" --notes "Build ${GITHUB_SHA::7}" --target "$GITHUB_SHA"
