name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Create Gradle wrapper & local config
        run: |
          mkdir -p android/gradle/wrapper
          cat << 'GRD' > android/settings.gradle
          rootProject.name = 'AntenaLibre'
          include ':app'
          GRD
          cat << 'PRP' > android/gradle.properties
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          PRP
          gradle wrapper --gradle-version 8.7 -p android

      - name: Copy web & app assets
        run: |
          mkdir -p android/app/src/main/assets
          cp -r src/web android/app/src/main/assets/web
          cp -r src/app android/app/src/main/assets/app

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: antena-libre-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
